name = "mnemosyne"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Both buckets are private (ADR 0002). `remote = true` makes local dev use
# the real buckets rather than a local simulation, so any write made from
# dev lands in the real Library.
#
# Functions get their `Env` type from these bindings via `npm run cf-typegen`
# (run automatically by `npm run typecheck`).

# Archived Originals, keyed by content hash.
[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "mnemosyne-originals"
remote = true

# Web encodes and the manifest.
[[r2_buckets]]
binding = "WEB"
bucket_name = "mnemosyne-web"
remote = true

# Who may watch (ADR 0002): "open" (anyone) or "password" (HTTP basic
# auth against the BASIC_AUTH_USER / BASIC_AUTH_PASSWORD secrets, set with
# `wrangler pages secret put` and, for local dev, in `.dev.vars`).
# Switching policy is a change to this value only.
[vars]
ACCESS_POLICY = "password"
